<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>How to Analyse a Chart – B1</title>
<style>
:root{--bg:#f6f8fb;--card:#fff;--tx:#1c2430;--mut:#5b6677;--pri:#2f6db5;--ok:#1e8e4e;--okb:#dff3e7;--no:#c0392b;--nob:#fbe3e0;--bd:#d5dbe5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161b22;--card:#1f2630;--tx:#e8edf3;--mut:#9aa6b5;--pri:#6aa6ec;--ok:#58c985;--okb:#1d3a2a;--no:#ef7b6e;--nob:#47231f;--bd:#3a4452}}
:root[data-theme="dark"]{--bg:#161b22;--card:#1f2630;--tx:#e8edf3;--mut:#9aa6b5;--pri:#6aa6ec;--ok:#58c985;--okb:#1d3a2a;--no:#ef7b6e;--nob:#47231f;--bd:#3a4452}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:1.6rem;margin:.2em 0}
h2{font-size:1.15rem;margin:0 0 8px;color:var(--pri)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin:14px 0}
.mut{color:var(--mut);font-size:.9rem}
.steps{display:flex;gap:8px;flex-wrap:wrap}
.steps span{background:var(--card);border:1px solid var(--pri);border-radius:20px;padding:4px 12px;font-weight:600}
.q{margin:12px 0}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
button,select{font:inherit;color:var(--tx)}
.opt{background:var(--bg);border:2px solid var(--bd);border-radius:10px;padding:10px 14px;min-height:44px;cursor:pointer}
.opt.sel{border-color:var(--pri);background:var(--card);box-shadow:inset 0 0 0 1px var(--pri)}
.opt.ok{border-color:var(--ok);background:var(--okb)}
.opt.no{border-color:var(--no);background:var(--nob)}
select{padding:8px;border:2px solid var(--bd);border-radius:8px;background:var(--bg);min-height:44px;max-width:100%}
select.ok{border-color:var(--ok);background:var(--okb)}select.no{border-color:var(--no);background:var(--nob)}
.go{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:11px 20px;min-height:44px;font-weight:600;cursor:pointer;margin-top:8px}
.go.sec{background:transparent;color:var(--pri);border:2px solid var(--pri);margin-left:8px}
.res{margin-top:10px;font-weight:600}
.gap{line-height:2.6}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0}
.row b{min-width:170px}
.ord{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.ans{min-height:50px;border:2px dashed var(--bd);border-radius:10px;padding:8px}
.ans div{padding:6px 8px;margin:4px 0;border-radius:8px;background:var(--bg)}
svg{width:100%;height:auto}
#total{font-size:1.3rem;text-align:center}
</style>
</head>
<body>
<main>
<h1>How to Analyse a Chart</h1>
<p class="mut">English · Year 10 · B1 · Look at the chart, then do the six tasks. Tap <b>Check</b> after each task.</p>
<div class="steps"><span>1 Describe</span><span>2 Interpret</span><span>3 Evaluate</span></div>

<div class="card" id="chart"></div>
<div id="tasks"></div>
<div class="card" id="total"><div id="tot">Your score: 0 / 0</div><div class="mut">Do all six tasks and tap Check each time.</div></div>
</main>
<script>
const Y=["2015","2017","2019","2021","2023","2025"],V=[2.0,2.4,3.0,4.1,3.9,4.2];
(function(){let w=700,h=300,l=50,b=40,t=40,r=10,pw=w-l-r,ph=h-t-b,bw=pw/Y.length;
let s=`<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Bar chart of daily phone use of teenagers 2015 to 2025"><text x="${w/2}" y="22" text-anchor="middle" font-weight="700" font-size="17" fill="currentColor">Daily phone use of teenagers (14–17) in Germany</text>`;
for(let i=0;i<=5;i++){let y=t+ph-ph*i/5;s+=`<line x1="${l}" x2="${w-r}" y1="${y}" y2="${y}" stroke="#8884" /><text x="${l-8}" y="${y+4}" text-anchor="end" font-size="13" fill="currentColor">${i}</text>`}
V.forEach((v,i)=>{let bh=ph*v/5,x=l+i*bw+bw*.2;s+=`<rect x="${x}" y="${t+ph-bh}" width="${bw*.6}" height="${bh}" rx="3" fill="#2f6db5"/><text x="${x+bw*.3}" y="${t+ph-bh-6}" text-anchor="middle" font-size="13" fill="currentColor">${v}</text><text x="${x+bw*.3}" y="${h-18}" text-anchor="middle" font-size="13" fill="currentColor">${Y[i]}</text>`});
s+=`<text x="14" y="${t+ph/2}" transform="rotate(-90 14 ${t+ph/2})" text-anchor="middle" font-size="13" fill="currentColor">Hours per day</text></svg><div class="mut">Source: example data for class use (not real data).</div>`;
document.getElementById("chart").innerHTML=s})();

const T=[
{n:"Task 1: Look at the basics",type:"mc",q:[
["What type of chart is it?",["Pie chart","Bar chart","Line graph"],1],
["What does the y-axis show?",["Years","Percent","Hours per day"],2],
["Does the y-axis start at zero?",["Yes","No"],0],
["Where does the data come from?",["A real government survey","Example data for class use","Social media"],1]]},
{n:"Task 2: Find the important information",type:"mc",q:[
["The highest value is …",["4.1 hours","4.2 hours","3.9 hours"],1],
["The lowest value is in the year …",["2015","2017","2023"],0],
["The number fell slightly between …",["2019 and 2021","2021 and 2023","2023 and 2025"],1],
["The number increased by … hours from 2015 to 2025.",["1.2","2.2","4.2"],1]]},
{n:"Task 3: Useful phrases – match them",type:"sel",q:[
["rose / increased",["went up","went down","stayed the same","a small decrease","a big increase"],0],
["fell / dropped",["went up","went down","stayed the same","a small decrease","a big increase"],1],
["remained stable",["went up","went down","stayed the same","a small decrease","a big increase"],2],
["a sharp rise",["went up","went down","stayed the same","a small decrease","a big increase"],4],
["a slight fall",["went up","went down","stayed the same","a small decrease","a big increase"],3]]},
{n:"Task 4: Complete the analysis",type:"gap",bank:["shows","rose","increase","fell","highest","reason","trend"],
 txt:"The bar chart [shows] how many hours teenagers in Germany use their phones every day. Between 2015 and 2021 the number [rose] from 2.0 to 4.1 hours. This is a sharp [increase]. After that, it [fell] slightly to 3.9 hours in 2023. In 2025 it reached its [highest] value: 4.2 hours. One possible [reason] is that more teenagers use social media. To sum up, the [trend] is going up."},
{n:"Task 5: Put the analysis in the right order",type:"ord",s:[
"The bar chart shows how many hours teenagers in Germany use their phones every day.",
"The number rose from 2.0 hours in 2015 to 4.2 hours in 2025.",
"The biggest increase was between 2019 and 2021.",
"One possible reason is that more teenagers use social media.",
"To sum up, teenagers spend much more time on their phones today."]},
{n:"Task 6: Think critically",type:"mc",q:[
["Which information is missing from the chart?",["The title","How many teenagers were asked","The unit"],1],
["Which is a good question about the chart?",["What do teenagers do on their phones?","What is the colour of the bars?","How old is the teacher?"],0],
["A y-axis that does not start at zero can be …",["misleading","more reliable","too long"],0],
["Is the source reliable?",["Yes, it is a real study","No, it is only example data","We cannot see a title"],1]]}
];
const sc=T.map(()=>0),mx=T.map(t=>t.type=="gap"?t.txt.match(/\[/g).length:t.type=="ord"?1:t.q.length);
const upd=()=>{document.getElementById("tot").textContent=`Your score: ${sc.reduce((a,b)=>a+b,0)} / ${mx.reduce((a,b)=>a+b,0)}`};
const sh=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
const box=document.getElementById("tasks");
T.forEach((t,ti)=>{
 const c=document.createElement("div");c.className="card";c.innerHTML=`<h2>${t.n}</h2><div class="body"></div><button class="go">Check</button><button class="go sec">Try again</button><div class="res"></div>`;
 const bd=c.querySelector(".body"),res=c.querySelector(".res"),ck=c.querySelector(".go"),rs=c.querySelector(".sec");
 let pick=[],seq=[],ord=[],selEls=[];
 const msg=(n)=>{sc[ti]=n;upd();res.textContent=n==mx[ti]?`🎉 ${n} / ${mx[ti]} – perfect!`:`${n} / ${mx[ti]} – look at the red answers and try again.`};
 const render=()=>{
  bd.innerHTML="";pick=[];seq=[];selEls=[];res.textContent="";
  if(t.type=="mc")t.q.forEach((q,qi)=>{const d=document.createElement("div");d.className="q";d.innerHTML=`<div>${qi+1}. ${q[0]}</div><div class="opts"></div>`;
   q[1].forEach((o,oi)=>{const b=document.createElement("button");b.className="opt";b.textContent=o;b.onclick=()=>{pick[qi]=oi;[...d.querySelectorAll(".opt")].forEach(x=>x.className="opt");b.classList.add("sel")};d.querySelector(".opts").append(b)});bd.append(d)});
  if(t.type=="sel")t.q.forEach((q,qi)=>{const d=document.createElement("div");d.className="row";d.innerHTML=`<b>${q[0]}</b>`;const s=document.createElement("select");s.innerHTML="<option value=''>– choose –</option>"+q[1].map((o,oi)=>`<option value="${oi}">${o}</option>`).join("");d.append(s);selEls.push(s);bd.append(d)});
  if(t.type=="gap"){bd.innerHTML=`<div class="mut">Word bank: <b>${t.bank.join(" · ")}</b></div><div class="gap"></div>`;let h=t.txt.replace(/\[(\w+)\]/g,()=>`<select></select>`);bd.querySelector(".gap").innerHTML=h;
   bd.querySelectorAll("select").forEach(s=>{s.innerHTML="<option value=''>–</option>"+sh(t.bank).map(o=>`<option>${o}</option>`).join("");selEls.push(s)})}
  if(t.type=="ord"){bd.innerHTML=`<div class="mut">Tap the sentences in the correct order (introduction → main part → reason → conclusion).</div><div class="ans"></div><div class="ord"></div>`;
   const ans=bd.querySelector(".ans"),lst=bd.querySelector(".ord");
   sh(t.s.map((x,i)=>[x,i])).forEach(([x,i])=>{const b=document.createElement("button");b.className="opt";b.textContent=x;b.onclick=()=>{seq.push(i);b.disabled=true;b.style.opacity=.4;const d=document.createElement("div");d.textContent=seq.length+". "+x;ans.append(d)};lst.append(b)})}
 };
 ck.onclick=()=>{let n=0;
  if(t.type=="mc"){t.q.forEach((q,qi)=>{const o=bd.querySelectorAll(".q")[qi].querySelectorAll(".opt");o.forEach((b,oi)=>{b.classList.remove("ok","no");if(oi==q[2])b.classList.add("ok");else if(pick[qi]==oi)b.classList.add("no")});if(pick[qi]==q[2])n++})}
  if(t.type=="sel"){selEls.forEach((s,i)=>{const ok=s.value!==""&&+s.value==t.q[i][2];s.className=ok?"ok":"no";if(ok)n++})}
  if(t.type=="gap"){const ans=[...t.txt.matchAll(/\[(\w+)\]/g)].map(m=>m[1]);selEls.forEach((s,i)=>{const ok=s.value==ans[i];s.className=ok?"ok":"no";if(ok)n++})}
  if(t.type=="ord"){n=seq.length==t.s.length&&seq.every((v,i)=>v==i)?1:0}
  msg(n)};
 rs.onclick=()=>{sc[ti]=0;upd();render()};
 render();box.append(c)});
upd();
</script>
</body>
</html>
